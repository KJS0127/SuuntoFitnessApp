name: iOS App Build & Test (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Environment Diagnostics
      run: |
        xcodebuild -version
        swift --version

    - name: Build & Test for iOS Simulator
      run: |
        echo "=========================================="
        echo "  Building & Testing for iOS Platform...  "
        echo "=========================================="
        cd SuuntoFitnessApp
        # iOS 시뮬레이터 타겟으로 컴파일 및 테스트
        xcodebuild test \
          -scheme SuuntoFitnessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Archive iOS App Bundle (.ipa)
      run: |
        echo "=========================================="
        echo "  Archiving Release Package for iOS...    "
        echo "=========================================="
        mkdir -p build/Payload
        mkdir -p build/정수_운동.app
        
        # Info.plist 복사
        if [ -f "SuuntoFitnessApp/Sources/App/Info.plist" ]; then
          cp SuuntoFitnessApp/Sources/App/Info.plist build/정수_운동.app/Info.plist
        fi
        
        # 모든 소스 및 리소스 번들 패키징
        cp -R SuuntoFitnessApp/Sources build/정수_운동.app/
        cp -R build/정수_운동.app build/Payload/
        
        cd build
        zip -r "정수_운동_앱번들.zip" 정수_운동.app
        zip -r "정수_운동.ipa" Payload
        cd ..

    - name: Upload iOS Install Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "정수-s-운동-iOS-설치파일"
        path: |
          build/정수_운동.ipa
          build/정수_운동_앱번들.zip
        retention-days: 14
