name: iOS App Build & Test (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 웹에서 수동으로 [Run workflow] 클릭 가능

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14 # Apple Silicon M1/M2 가상 Mac 환경

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Environment Diagnostics
      run: |
        xcodebuild -version
        swift --version

    - name: Run Unit Test Suite
      run: |
        echo "=========================================="
        echo "  Running SuuntoFitnessApp Unit Tests...  "
        echo "=========================================="
        cd SuuntoFitnessApp
        swift test

    - name: Build iOS Application Binary
      run: |
        echo "=========================================="
        echo "  Compiling iOS App Sources...           "
        echo "=========================================="
        cd SuuntoFitnessApp
        swift build -c release

    - name: Create iOS App Bundle & IPA Package
      run: |
        mkdir -p build/Payload
        mkdir -p build/SuuntoFitnessApp.app
        
        # Info.plist 복사
        if [ -f "SuuntoFitnessApp/Sources/App/Info.plist" ]; then
          cp SuuntoFitnessApp/Sources/App/Info.plist build/SuuntoFitnessApp.app/Info.plist
        fi
        
        # 컴파일된 바이너리 복사
        BIN_PATH=$(find SuuntoFitnessApp/.build/release -type f -perm +111 -name "SuuntoFitnessApp*" | head -n 1)
        if [ -f "$BIN_PATH" ]; then
          cp "$BIN_PATH" build/SuuntoFitnessApp.app/SuuntoFitnessApp
        fi
        
        # Payload 패키징
        cp -R build/SuuntoFitnessApp.app build/Payload/
        cd build
        zip -r "정수's_운동_앱번들.zip" SuuntoFitnessApp.app
        zip -r "정수's_운동.ipa" Payload
        cd ..

    - name: Upload iOS Install Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "정수-s-운동-iOS-설치파일"
        path: |
          build/정수's_운동.ipa
          build/정수's_운동_앱번들.zip
        retention-days: 14
