name: iOS App Build & Test (GitHub Actions)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Diagnostics
      run: |
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-path

    - name: Compile with iOS SDK
      run: |
        echo "=========================================="
        echo "  Compiling for iOS 17 Simulator SDK...   "
        echo "=========================================="
        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        cd SuuntoFitnessApp
        swift build \
          -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" \
          -Xswiftc "-target" -Xswiftc "arm64-apple-ios17.0-simulator"

    - name: Create iOS App Bundle & IPA Package
      run: |
        echo "=========================================="
        echo "  Packaging Release Package for iOS...    "
        echo "=========================================="
        mkdir -p build/Payload
        mkdir -p build/정수_운동.app
        
        # Info.plist 복사
        if [ -f "SuuntoFitnessApp/Sources/App/Info.plist" ]; then
          cp SuuntoFitnessApp/Sources/App/Info.plist build/정수_운동.app/Info.plist
        fi
        
        # 컴파일된 바이너리 복사
        BIN_PATH=$(find SuuntoFitnessApp/.build -type f -perm +111 -name "SuuntoFitnessApp*" | head -n 1)
        if [ -f "$BIN_PATH" ]; then
          cp "$BIN_PATH" build/정수_운동.app/정수_운동
        fi
        
        # 소스 파일 및 메타데이터 포함
        cp -R SuuntoFitnessApp/Sources build/정수_운동.app/
        cp -R build/정수_운동.app build/Payload/
        
        cd build
        zip -r "정수_운동_앱번들.zip" 정수_운동.app
        zip -r "정수_운동.ipa" Payload
        cd ..

    - name: Upload iOS Install Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "정수-s-운동-iOS-설치파일"
        path: |
          build/정수_운동.ipa
          build/정수_운동_앱번들.zip
        retention-days: 14
